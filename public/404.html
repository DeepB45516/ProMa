<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | ProMa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233454D1%22/><rect x=%2226%22 y=%2244%22 width=%2212%22 height=%2230%22 rx=%223%22 fill=%22white%22/><rect x=%2244%22 y=%2230%22 width=%2212%22 height=%2244%22 rx=%223%22 fill=%22white%22/><rect x=%2262%22 y=%2218%22 width=%2212%22 height=%2256%22 rx=%223%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 24px;
    margin: 0;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-modal);
    max-width: 520px;
    width: 100%;
    padding: 48px 36px;
    text-align: center;
  }
  .error-code {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: -0.04em;
  }
  .error-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .error-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .error-desc {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .error-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page or Workspace Not Found</h1>
    <p class="error-desc">The page or workspace you're looking for doesn't exist, may have been renamed, or you might not have access to it.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">🏠 Back to ProMa Main Page</a>
      <button onclick="window.history.back()" class="btn btn-ghost">← Go Back</button>
    </div>
  </div>
</body>
</html>
