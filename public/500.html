<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>500 — Server Error | ProMa</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 24px;
    margin: 0;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-modal);
    max-width: 520px;
    width: 100%;
    padding: 48px 36px;
    text-align: center;
  }
  .error-code {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    color: var(--overdue);
    margin-bottom: 8px;
    letter-spacing: -0.04em;
  }
  .error-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .error-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .error-desc {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .error-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">⚠️</div>
    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-desc">Something went wrong on our servers while processing your request. Please try refreshing the page or try again in a few moments.</p>
    <div class="error-actions">
      <button onclick="window.location.reload()" class="btn btn-primary">↻ Reload Page</button>
      <a href="/" class="btn btn-ghost">🏠 Back to Main Page</a>
    </div>
  </div>
</body>
</html>
